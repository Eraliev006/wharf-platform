[project]
name = "auth"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "grpcio>=1.83.1",
    "grpcio-tools>=1.83.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
]

[tool.uv.build-backend]
module-name="app"
module-root=""

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "types-grpcio>=1.84.0.20260928",
    "types-protobuf>=7.35.1.20260906",
]

[project.scripts]
auth = "app.main:main"

[tool.mypy]
python_version = "3.13"
strict = true
exclude = [
    "app/generated/",
]

[[tool.mypy.overrides]]
module = "app.generated.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "app.services.auth_servicer"
disallow_subclassing_any = false

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["app/generated"]
force-exclude = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["F", "I", "E", "B", "UP"]
