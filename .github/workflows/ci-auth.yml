
name: CI AUTH

on:
  push:
    paths: [auth/**, proto/auth/**, codegen/generate_auth.sh, .github/workflows/ci-auth.yml]
  pull_request:
    paths: [auth/**, proto/auth/**, codegen/generate_auth.sh, .github/workflows/ci-auth.yml]

defaults:
  run:
    working-directory: ./auth

jobs:
  lint:
    name: Check lint, format and typing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
           enable-cache: true
           cache-dependency-glob: auth/uv.lock

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: auth/.python-version

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install the Project
        run: uv sync --locked --all-extras --dev

      - name: Run lint
        run: uv run ruff check .

      - name: Run formatting
        run: uv run ruff format --check .

      - name: Run MyPy
        run: uv run mypy .

  auth-test:
    name: Run pytests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: wharf
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      APP_ENV: local
      DB_URL: postgresql+asyncpg://test:test@localhost:5432/test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-secret
      GOOGLE_REDIRECT_URI: http://localhost/callback
      GITHUB_CLIENT_ID: test-cleint-id
      GITHUB_CLIENT_SECRET: test-secret
      GITHUB_REDIRECT_URI: http://localhost/callback
      JWT_SECRET_KEY: test-secret-
      JWT_ACCESS_TOKEN_TTL_MIN: 15
      JWT_REFRESH_TOKEN_TTL_DAY: 15
      GRPC_SERVER_PORT: 50051
      LOG_LEVEL: INFO
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v6

      - name: Install UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
           enable-cache: true
           cache-dependency-glob: auth/uv.lock

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: auth/.python-version

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install the Project
        run: uv sync --locked --all-extras --dev

      - name: Prepare database PostgreSQL
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: wharf
          TEST_POSTGRES_DB: wharf_test
          AUTH_DB_PASSWORD: auth_password
          API_DB_PASSWORD: api_password
          PGHOST: localhost
          PGPASSWORD: postgres
        run: |
          bash ../scripts/01_create_users_and_schemas.sh
          bash ../scripts/02_configure_users.sh
          bash ../scripts/03_creat_test_db.sh

      - name: Run smoke tests
        run: uv run pytest -m smoke

      - name: Run integration tests
        env:
          TEST_DB_URL: postgresql+asyncpg://auth_user:auth_password@localhost:5432/wharf_test
        run: uv run pytest -m integration
