repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy-api
        name: mypy api
        entry: bash -c 'cd api && uv run mypy .'
        language: system
        files: ^api/
        pass_filenames: false
        types: [python]

      - id: mypy-auth
        name: mypy auth
        entry: bash -c 'cd auth && uv run mypy .'
        language: system
        files: ^auth/
        pass_filenames: false
        types: [python]
